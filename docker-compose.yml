services:
  deep_agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: deep_agent:local
    container_name: deep_agent
    env_file:
      - .env
    environment:
      # DOMAIN sets the default pack for requests that arrive without an
      # X-Domain header (CLI, worker, and fallback for /chat). Multi-domain
      # web clients pick a pack per request via the header instead.
      DOMAIN: ${DOMAIN:-reference}
      # MONGODB_DB is the prefix in multi-domain mode; per-request domain
      # resolution appends the pack name as a suffix (e.g. deep_agent_finance).
      MONGODB_DB: ${MONGODB_DB:-deep_agent}
      DOMAINS_ROOT: /app/domains
      # Origin the frontend nginx serves — backend's CORS allowlist uses this
      # when ALLOW_INSECURE=false. Override for non-localhost deployments.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    volumes:
      - ./domains:/app/domains:ro
    ports:
      # Backend is on 8000 inside the container; expose 8010 by default.
      # Override with DEEP_AGENT_PORT if that's busy.
      - "${DEEP_AGENT_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: deep_agent_frontend:local
    container_name: deep_agent_frontend
    depends_on:
      deep_agent:
        condition: service_healthy
    ports:
      # nginx listens on 3000; proxies /api/* to deep_agent:8000.
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
